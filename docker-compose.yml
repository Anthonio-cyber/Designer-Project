# Local production run:  docker compose up --build
# Put real values in a .env file beside this one first (see .env.example).
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-4000}:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      # Behind a TLS terminator these two must be the public https origin.
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:4000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a long random value}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a long random value}
      ADMIN_NAME: ${ADMIN_NAME:-Studio Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@designer.studio}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set the first admin password}
      # Connectors — all optional; the app runs without them.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
    volumes:
      # The database and every uploaded file live here. Back this up.
      - studio-data:/data

volumes:
  studio-data:
